<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asyar</title>
    <script>
      // Boot-error trap (debug aid): records module-load/render failures so
      // they survive reloads. Safe to remove once the React shell is stable.
      (function () {
        try {
          var log = JSON.parse(localStorage.getItem('asyar-boot-errors') || '[]');
          var push = function (msg) {
            log.push(String(msg).slice(0, 500));
            localStorage.setItem('asyar-boot-errors', JSON.stringify(log.slice(-10)));
          };
          window.addEventListener('error', function (e) {
            push('ERR ' + e.message + ' @ ' + (e.filename || '') + ':' + e.lineno);
          });
          window.addEventListener('unhandledrejection', function (e) {
            push('REJ ' + ((e.reason && (e.reason.stack || e.reason.message)) || e.reason));
          });
        } catch (err) {}
      })();
    </script>
  </head>
  <body>
    <div id="root" style="display: contents"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
