[package]
name = "asyar"
version = "0.1.1-45"
description = "A fast, open-source launcher for Windows."
authors = ["Khoshbin Ali <xoshbin@gmail.com>"]
license = "GPL-3.0-only"
edition = "2021"

[workspace]
members = [".", "asyar-summon"]
default-members = ["."]
resolver = "2"

[profile.release.package.asyar-summon]
strip = "symbols"

[lib]
name = "asyar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
semver = "1"
serde_json = "1"

[dependencies]
percent-encoding = "2.3"
base64 = "0.22"
dirs = "5.0"
url = "2"
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico", "test"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
semver = "1"
specta = { version = "2.0.0-rc.23", features = ["derive", "collect", "serde_json"] }
specta-typescript = "0.0.10"
serde_json = "1"
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
thiserror = "2"
enigo = "0.1.3"
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
plist = "1.7"
sys-locale = "0.3"
tauri-plugin-notification = "2"
tokio = { version = "1.0", features = ["full"] }
tauri-plugin-clipboard-x = "2"
window-vibrancy = "0.6"
fuzzy-matcher = "0.3.7"
sysinfo = "0.31"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
scrypt = { version = "0.11", default-features = false }
hex = "0.4"
flate2 = "1"
tar = "0.4"
argon2 = "0.5"
bip39 = { version = "2.0", default-features = false, features = ["std"] }
rand = "0.10"
zeroize = "1"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
zip = { version = "2.1", default-features = false, features = ["deflate"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
tempfile = "3.10"
dunce = "1"
async_zip = { version = "0.0.17", features = ["full", "tokio"] }
liblzma-sys = { version = "0.4", features = ["static"] }
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-shell = "2.3.5"
tauri-plugin-os = "2.0.0"
tauri-plugin-updater = "2.0.0"
tauri-plugin-deep-link = "2"
arboard = "3.6.1"
trash = "5"
regex = "1"
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4", "serde"] }
notify = "8"
notify-debouncer-full = "0.7"
globset = "0.4"
async-trait = "0.1"
chrono = "0.4"
evalexpr = "12"
axum = { version = "0.7", features = ["ws"] }
memchr = "2"
nucleo = "0.5"
ignore = "0.4"
fnv = "1"
file-id = "0.2"
bincode = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
fend-core = "1.5.8"
chrono-tz = "0.10.4"
iana-time-zone = "0.1.65"
rdev = "0.5"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
png = "0.17"
windows = { version = "0.61", features = [
    "Foundation",
    "Media",
    "Media_Control",
    "Storage_Streams",
    "Foundation",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Shell_Common",
    "Win32_UI_Accessibility",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_System_Shutdown",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_ToolHelp",
] }
wmi = "0.14"
winreg = "0.56"

[features]
cargo-clippy = []

[dev-dependencies]
mockito = "1.4"
proptest = "1"
serial_test = "3"
tokio-tungstenite = "0.21"
